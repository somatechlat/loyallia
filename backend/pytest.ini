[pytest]
# ⚠️ CRITICAL: Tests MUST run inside the loyallia-api Docker container.
#   docker exec loyallia-api pytest --reuse-db -q
# Do NOT run pytest directly on the host — PostgreSQL/Redis/Vault hostnames
# resolve only inside the Docker network.
DJANGO_SETTINGS_MODULE = loyallia.settings.test
python_files = test_*.py tests.py *_test.py
testpaths = tests apps
addopts = --strict-markers
markers =
    unit: isolated unit tests
    api: API endpoint tests
    integration: cross-app integration tests
    security: security and abuse-case tests
    billing: subscription, invoice, payment, and webhook tests
    concurrency: race-condition and locking tests
    migration: migration and schema drift tests
    slow: longer-running tests excluded from quick local loops when needed
    smoke: quick smoke tests verifying critical paths
