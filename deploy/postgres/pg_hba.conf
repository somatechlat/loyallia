# =============================================================================
# Loyallia PostgreSQL Host-Based Authentication Configuration
# =============================================================================
# This file controls client authentication for the Loyallia PostgreSQL
# primary instance. It is mounted read-only via docker-compose.yml and
# referenced by the postgres container's hba_file setting.
#
# Each line has the format:
#   TYPE  DATABASE  USER  ADDRESS  METHOD
#
#   TYPE     : local (Unix socket) or host (TCP/IP)
#   DATABASE : Database name, 'all', 'replication', or comma-separated list
#   USER     : User name, 'all', or comma-separated list
#   ADDRESS  : Client address (IP/CIDR, 'samenet', or omitted for local)
#   METHOD   : Authentication method (trust, scram-sha-256, md5, etc.)
#
# Security notes:
#   - Local socket uses 'trust' because access is restricted to the container
#   - Replication connections are limited to the same Docker network
#   - All remote connections require SCRAM-SHA-256 password authentication
# =============================================================================

# Local socket access is limited to the postgres container namespace.
local   all             all                                     trust

# Streaming replica access is limited to peers on the same Docker network.
host    replication     loyallia             samenet             scram-sha-256

# Application and PgBouncer connections require SCRAM authentication.
host    all             all                  0.0.0.0/0           scram-sha-256
host    all             all                  ::/0                scram-sha-256
