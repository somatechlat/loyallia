worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Rate-limit zones must live in the http context.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    upstream api {
        server api:8000;
    }

    upstream web {
        server web:3000;
    }

    upstream minio {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        # Dynamic DNS resolution for Docker containers (re-resolves on TTL expiry)
        resolver 127.0.0.11 valid=5s;
        resolver_timeout 5s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS disabled for local development — browsers force HTTPS with this header
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # Relaxed CSP for local dev with external APIs (MinIO, Google OAuth, QR charts)
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http: https:; img-src 'self' http: https: data: blob:;" always;

        client_max_body_size 10m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        client_body_timeout 30s;
        client_header_timeout 30s;
        send_timeout 30s;
        # Limit request body and headers
        client_header_buffer_size 4k;
        large_client_header_buffers 4 8k;

        gzip on;
        gzip_types text/plain application/json application/javascript text/css;
        gzip_min_length 1000;

        location /api/v1/auth/ {
            # Rate limiting: 10 req/sec per IP with 20 req burst
            limit_req zone=auth burst=20 nodelay;
            set $api_backend api:8000;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $api_backend api:8000;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Large headers: Google Wallet redirect URLs can be 3000+ chars in Location header
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        location /assets/ {
            proxy_pass http://minio/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        location / {
            set $web_backend web:3000;
            proxy_pass http://$web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js dev-mode HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
    }

    # Redirect HTTP to HTTPS (production only)
    # Uncomment when SSL certificates are configured:
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }
}
