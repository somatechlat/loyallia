global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@loyallia.com'
  smtp_auth_username: ''
  smtp_auth_password: ''

templates:
- '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
  - match:
      severity: critical
    receiver: 'critical'
    continue: true
  - match:
      severity: warning
    receiver: 'warning'

receivers:
- name: 'default'
  email_configs:
  - to: 'admin@loyallia.com'
    send_resolved: true

- name: 'critical'
  email_configs:
  - to: 'admin@loyallia.com'
    send_resolved: true
    headers:
      Subject: '[CRITICAL] Loyallia Alert: {{ .GroupLabels.alertname }}'

- name: 'warning'
  email_configs:
  - to: 'admin@loyallia.com'
    send_resolved: true

inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname']
