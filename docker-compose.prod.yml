# =============================================================================
# LOYALLIA — Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides development defaults with production settings:
#   - Gunicorn instead of runserver
#   - Pre-built Next.js (standalone) instead of next dev
#   - No source code volume mounts
#   - DEBUG=False, production Django settings
#   - No seed_test_data on startup
# =============================================================================

x-production-backend-env: &production-backend-env
  DATABASE_URL: postgres://${POSTGRES_USER:-loyallia}@postgres:5432/${POSTGRES_DB:-loyallia}
  DATABASE_DIRECT_URL: postgres://${POSTGRES_USER:-loyallia}@postgres:5432/${POSTGRES_DB:-loyallia}
  PGBOUNCER_URL: postgres://${POSTGRES_USER:-loyallia}@pgbouncer:6432/${POSTGRES_DB:-loyallia}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET_PASSES: passes
  MINIO_BUCKET_ASSETS: assets
  DJANGO_SETTINGS_MODULE: loyallia.settings.production
  DEBUG: "False"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-rewards.loyallia.com,api}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://rewards.loyallia.com}"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  VAULT_ADDR: ${VAULT_ADDR:-https://vault:8200}
  VAULT_TOKEN_FILE: /run/loyallia-vault/app-token
  VAULT_SECRET_PATH: ${VAULT_SECRET_PATH:-secret/data/loyallia/production}
  VAULT_SKIP_VERIFY: "true"
  APPLE_WALLET_MODE: vault
  GOOGLE_WALLET_MODE: vault
  PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-bendo}
  PAYMENT_GATEWAY_BASE_URL: ${PAYMENT_GATEWAY_BASE_URL:-https://checkout.placetopay.com}
  EMAIL_HOST: ${EMAIL_HOST:-in-v3.mailjet.com}
  EMAIL_PORT: "${EMAIL_PORT:-587}"
  EMAIL_FROM: ${EMAIL_FROM:-noreply@loyallia.com}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://rewards.loyallia.com/api/v1/auth/google/callback/}

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyallia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyallia -d ${POSTGRES_DB:-loyallia}"]

  postgres-replica:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyallia -d ${POSTGRES_DB:-loyallia}"]

  pgbouncer:
    command: >
      sh -c "export DATABASE_URL=postgres://loyallia:$$(cat /run/loyallia-vault/postgres_password)@postgres:5432/${POSTGRES_DB:-loyallia} && exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini"

  # ---------------------------------------------------------------------------
  # DJANGO API — Production: Gunicorn WSGI
  # ---------------------------------------------------------------------------
  api:
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn loyallia.wsgi:application --bind 0.0.0.0:8000 --workers 8 --worker-class gthread --threads 4 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --log-level info --access-logfile - --error-logfile -"

    environment:
      <<: *production-backend-env
      # ═══════════════════════════════════════════════════════════════════════
      # GOOGLE OAUTH 2.0 — PRODUCTION MODE
      # ───────────────────────────────────────────────────────────────────────
      # PRODUCTION ONLY: Uses the live rewards.loyallia.com OAuth client.
      # NEVER commit client_id/client_secret to any file — they live ONLY in Vault.
      #   Authorized JS origins: https://rewards.loyallia.com
      #   Authorized redirect URIs: https://rewards.loyallia.com/api/v1/auth/google/callback/
      # ═══════════════════════════════════════════════════════════════════════
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    # NO source code mount in production

  # ---------------------------------------------------------------------------
  # NEXT.JS — Production: Pre-built standalone server
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://rewards.loyallia.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://rewards.loyallia.com}
    environment:
      NODE_ENV: production
      NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://rewards.loyallia.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://rewards.loyallia.com}
    volumes: []
    # NO source code mounts, NO polling — uses pre-built standalone output

  # ---------------------------------------------------------------------------
  # CELERY WORKERS — Production: no source mounts
  # ---------------------------------------------------------------------------
  celery-pass:
    environment:
      <<: *production-backend-env
    volumes:
      - ./certs:/app/certs:ro

  celery-push:
    environment:
      <<: *production-backend-env
    volumes:
      - ./certs:/app/certs:ro

  celery-default:
    environment:
      <<: *production-backend-env
    volumes:
      - ./certs:/app/certs:ro

  celery-beat:
    environment:
      <<: *production-backend-env

  flower:
    environment:
      <<: *production-backend-env

  vault-init:
    environment:
      VAULT_APP_SECRET_PATH: loyallia/production
    volumes: !reset []
      - ./.bootstrap_secrets.production.env:/vault/bootstrap/secrets.env:ro

  # ═══════════════════════════════════════════════════════════════════════
  # NGINX — Production: Host nginx handles 80/443, container has NO port bind
  # ───────────────────────────────────────────────────────────────────────
  # The host-level nginx (deploy/rewards.loyallia.com.conf) manages SSL,
  # rate limiting, and proxies directly to container ports 33905/33906.
  # The container nginx must NOT bind to host ports 80/443.
  # ═══════════════════════════════════════════════════════════════════════
  nginx:
    ports: !reset []
