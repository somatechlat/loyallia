# =============================================================================
# LOYALLIA — Full Docker Compose Stack (Production-Grade for Localhost)
# All services open source — PostgreSQL + Redis + MinIO + Django + Next.js
# PORT RANGE: 33900+ (see docs/PORT_AUTHORITY.md)
# TOTAL CLUSTER LIMIT: 12GB RAM
# ACTUAL BUDGET: ~9.4GB allocated (headroom for OS/Docker daemon + spikes)
#
# MEMORY ALLOCATION:
#   postgres=1.5G | redis=512M | minio=512M | pgbouncer=128M
#   api=2G | web=2G | celery-pass/push/default=384Mx3 | celery-beat=192M
#   flower=192M | vault=256M | whatsapp-bridge=256M | listmonk=256M
#   init containers=64Mx2 (ephemeral)
#
# SECRETS: Local development may seed Vault from .env. Production app runtime
# secrets must be read from Vault, not plaintext environment variables.
# =============================================================================

x-common-env: &common-env
  DATABASE_URL: postgres://${POSTGRES_USER:-loyallia}:PASSWORD_REQUIRED@postgres:5432/${POSTGRES_DB:-loyallia}
  DATABASE_DIRECT_URL: postgres://${POSTGRES_USER:-loyallia}:PASSWORD_REQUIRED@postgres:5432/${POSTGRES_DB:-loyallia}
  # PgBouncer available at pgbouncer:6432 for connection pooling in production
  PGBOUNCER_URL: postgres://${POSTGRES_USER:-loyallia}:PASSWORD_REQUIRED@pgbouncer:6432/${POSTGRES_DB:-loyallia}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET_PASSES: passes
  MINIO_BUCKET_ASSETS: assets
  DJANGO_SETTINGS_MODULE: loyallia.settings.development
  DEBUG: "False"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-rewards.loyallia.com,localhost,127.0.0.1}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:33906,http://localhost:33905}"
  # Vault
  VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
  VAULT_TOKEN_FILE: /run/loyallia-vault/app-token
  VAULT_SECRET_PATH: ${VAULT_SECRET_PATH:-secret/data/loyallia/production}
  # Apple Wallet
  APPLE_WALLET_MODE: vault
  # Google Wallet
  GOOGLE_WALLET_MODE: vault
  # Payment Gateway (manual admin verification or disabled)
  PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-manual}
  PAYMENT_GATEWAY_BASE_URL: ${PAYMENT_GATEWAY_BASE_URL:-}
  # Email
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: "${EMAIL_PORT:-587}"
  EMAIL_FROM: ${EMAIL_FROM:-noreply@loyallia.com}
  # Google OAuth 2.0 (Social Login)
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:33905/api/v1/auth/google/callback/}
  # Sentry error tracking (B-013)
  SENTRY_DSN: ${SENTRY_DSN:-}
  # WhatsApp Bridge (LYL-SRS-006)
  WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3001
  WHATSAPP_BRIDGE_API_KEY: ${WHATSAPP_BRIDGE_API_KEY:-dev-bridge-key}
  # Listmonk Email Engine (LYL-SRS-006)
  LISTMONK_URL: http://listmonk:9000
  LISTMONK_API_USER: ${LISTMONK_API_USER:-loyallia}
  LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN:-}

services:
  # ---------------------------------------------------------------------------
  # POSTGRESQL 16 — Primary Database  → localhost:33900              [1.5GB]
  # Production: WAL archiving, tuned memory, persistent volume
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.2-alpine
    container_name: loyallia-postgres
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyallia}
      POSTGRES_USER: ${POSTGRES_USER:-loyallia}
      POSTGRES_PASSWORD_FILE: /run/loyallia-vault/postgres_password
      # Production-grade PostgreSQL tuning
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=384MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=mkdir -p /var/lib/postgresql/data/wal_archive && (test -f /var/lib/postgresql/data/wal_archive/%f || cp %p /var/lib/postgresql/data/wal_archive/%f)"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33900:5432"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyallia -d loyallia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # POSTGRESQL REPLICA — Streaming Replication (LYL-H-INFRA-015)
  # Hot standby for read scaling and failover
  # ---------------------------------------------------------------------------
  postgres-replica:
    image: postgres:16.2-alpine
    container_name: loyallia-postgres-replica
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loyallia}
      POSTGRES_PASSWORD_FILE: /run/loyallia-vault/postgres_password
      PGUSER: ${POSTGRES_USER:-loyallia}
      PGPASSWORD_FILE: /run/loyallia-vault/postgres_password
    command: sh /usr/local/bin/replica-entrypoint.sh
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33911:5432"
    networks:
      - backend-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyallia -d loyallia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # PGBOUNCER — Connection Pooling      → localhost:33901            [128M]
  # Transaction pooling for millions of concurrent connections
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: loyallia-pgbouncer
    command: >
      sh -c "export DATABASE_URL=postgres://${POSTGRES_USER:-loyallia}:$$(cat /run/loyallia-vault/postgres_password)@postgres:5432/${POSTGRES_DB:-loyallia} && exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini"
    environment:
      LISTEN_PORT: "6432"
      AUTH_TYPE: "scram-sha-256"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "80"
      MIN_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "20"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_IDLE_TIMEOUT: "300"
      SERVER_LIFETIME: "1800"
      LOG_CONNECTIONS: "1"
      LOG_DISCONNECTIONS: "1"
    ports:
      - "127.0.0.1:33901:6432"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - vault_runtime:/run/loyallia-vault:ro
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-019: PgBouncer healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U loyallia"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M

  # ---------------------------------------------------------------------------
  # REDIS 7 — Cache + Celery Broker     → localhost:33902            [512M]
  # AOF persistence, LRU eviction, production limits
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2.4-alpine
    container_name: loyallia-redis
    depends_on:
      vault-init:
        condition: service_completed_successfully
    command: >
      sh -c 'redis-server --dir /data --requirepass "$$(cat /run/loyallia-vault/redis_password)" --appendonly yes --appendfsync everysec --maxmemory 400mb --maxmemory-policy noeviction --save 900 1 --save 300 10 --save 60 10000 --tcp-keepalive 300 --timeout 300'
    volumes:
      - redis_data:/data
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33902:6379"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/loyallia-vault/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MINIO — S3-Compatible Object Storage → localhost:33903-33904     [512M]
  # Persistent volume for passes, assets (Apple/Google Wallet PKPasses)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: loyallia-minio
    depends_on:
      vault-init:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/loyallia-vault/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/loyallia-vault/minio_root_password
    volumes:
      - minio_data:/data
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33903:9000"
      - "127.0.0.1:33904:9001"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: loyallia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      export MINIO_ROOT_USER=$$(cat /run/loyallia-vault/minio_root_user) &&
      export MINIO_ROOT_PASSWORD=$$(cat /run/loyallia-vault/minio_root_password) &&
      mc alias set local http://minio:9000 \$$MINIO_ROOT_USER \$$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/passes &&
      mc mb --ignore-existing local/assets &&
      mc anonymous set download local/assets &&
      echo 'MinIO buckets ready'
      "
    volumes:
      - vault_runtime:/run/loyallia-vault:ro
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # DJANGO API — Django 5 + Django Ninja → localhost:33905           [2GB]
  # Production-grade: migrate, collectstatic, seed plans, Gunicorn-ready
  # Live reload via volume mount for dev; switch to gunicorn for prod
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-api
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *common-env
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:33905:8000"
    stop_grace_period: 30s  # B-012: Graceful shutdown for in-flight requests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening (read_only omitted — dev volume mounts need write)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
        reservations:
          memory: 768M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.2
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # NEXT.JS — Dashboard + Scanner PWA   → localhost:33906           [2GB]
  # Production-grade: optimized build, persistent .next cache
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loyallia-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:33905}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:33906}
      NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL:-http://api:8000}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:33906:3000"
    stop_grace_period: 30s  # B-012: Graceful shutdown
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/tests:/app/tests:ro
      - ./frontend/playwright.config.ts:/app/playwright.config.ts:ro
      - next_cache:/app/.next/cache
    depends_on:
      - api
    networks:
      - frontend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "1.5"
        reservations:
          memory: 512M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

  # ---------------------------------------------------------------------------
  # CELERY WORKERS — Async Task Processing                         [1.2GB total]
  # max-tasks-per-child prevents memory leaks in long-running workers
  # ---------------------------------------------------------------------------

  # Worker 1: Pass generation (high priority)                      [384M]
  celery-pass:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-pass
    command: celery -A loyallia worker -Q pass_generation -c 2 -l info --max-tasks-per-child=500
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    stop_grace_period: 30s  # B-012: Graceful shutdown for in-flight tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-020: Celery worker healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A loyallia inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # Worker 2: Push notification delivery                           [384M]
  celery-push:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-push
    command: celery -A loyallia worker -Q push_delivery -c 2 -l info --max-tasks-per-child=500
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    stop_grace_period: 30s  # B-012: Graceful shutdown
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-020: Celery worker healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A loyallia inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # Worker 3: Default queue (email, billing, automation)           [384M]
  celery-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-default
    command: celery -A loyallia worker -Q default,email,billing,whatsapp_delivery,sms_delivery -c 2 -l info --max-tasks-per-child=500
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    stop_grace_period: 30s  # B-012: Graceful shutdown
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-020: Celery worker healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A loyallia inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # ---------------------------------------------------------------------------
  # CELERY BEAT — Scheduled Jobs Scheduler                         [128M]
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-beat
    command: celery -A loyallia beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
        reservations:
          memory: 96M

  # ---------------------------------------------------------------------------
  # FLOWER — Celery Worker Monitor       → localhost:33907          [128M]
  # ---------------------------------------------------------------------------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-flower
    command: >
      sh -c "FLOWER_BASIC_AUTH=$$(python -c 'from common.vault import get_secret; print(get_secret(\"flower_basic_auth\", strict=True), end=\"\")') || exit 1; [ -n \"$$FLOWER_BASIC_AUTH\" ] || exit 1; export FLOWER_BASIC_AUTH; exec celery -A loyallia flower --port=5555"
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:33907:5555"
    depends_on:
      - redis
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"

  # ---------------------------------------------------------------------------
  # WHATSAPP BRIDGE — Baileys REST API    → localhost:33914           [256M]
  # LYL-SRS-006: Multi-tenant WhatsApp messaging via Baileys
  # SEC: Internal network only — never exposed to public internet
  # ---------------------------------------------------------------------------
  whatsapp-bridge:
    build:
      context: ./services/whatsapp-bridge
      dockerfile: Dockerfile
    container_name: loyallia-whatsapp-bridge
    command: >
      sh -c 'export REDIS_URL="redis://:$$(cat /run/loyallia-vault/redis_password)@redis:6379/3" && exec node src/index.js'
    environment:
      API_KEY: ${WHATSAPP_BRIDGE_API_KEY:-dev-bridge-key}
      DJANGO_WEBHOOK_URL: http://api:8000
      MAX_MESSAGES_PER_MINUTE: 8
      MAX_MESSAGES_PER_HOUR: 200
      AVG_DELAY_MS: 6000
      LOG_LEVEL: info
    volumes:
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33914:3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # LISTMONK — Mass Email Engine          → localhost:33915           [256M]
  # LYL-SRS-006: High-performance campaign email delivery
  # Shares PostgreSQL with main app (separate 'listmonk' schema)
  # SEC: Admin dashboard internal-only — super admins use Django API bridge
  # ---------------------------------------------------------------------------
  listmonk:
    image: listmonk/listmonk:v4.1.0
    container_name: loyallia-listmonk
    command: >
      sh -c 'export LISTMONK_db__password="$$(cat /run/loyallia-vault/postgres_password)" && exec ./listmonk --config /etc/listmonk/config.toml'
    volumes:
      - ./services/listmonk/config.toml:/etc/listmonk/config.toml:ro
      - vault_runtime:/run/loyallia-vault:ro
    environment:
      TZ: America/Guayaquil
      LISTMONK_app__admin_password: ${LISTMONK_ADMIN_PASSWORD:-loyallia-dev}
    ports:
      - "127.0.0.1:33915:9000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # HASHICORP VAULT — Secret Management   → localhost:33908           [256M]
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.15.6
    container_name: loyallia-vault
    user: "0:0"
    command: vault server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    volumes:
      - ./deploy/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
    ports:
      - "127.0.0.1:33908:8200"
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Vault KV v2 initialization — seeds secrets for development
  vault-init:
    image: hashicorp/vault:1.15.6
    container_name: loyallia-vault-init
    user: "0:0"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_APP_SECRET_PATH: ${VAULT_APP_SECRET_PATH:-loyallia/production}
      # Zero-Secret: No .env secrets passed. vault-init reads existing
      # Vault data on subsequent boots. First-time bootstrap requires
      # manual vault kv put (see deploy/vault/README.md).
    volumes:
      - vault_data:/vault/file
      - vault_runtime:/vault/runtime
      - ./deploy/vault/init.sh:/vault/bootstrap/init.sh:ro
    entrypoint: /bin/sh /vault/bootstrap/init.sh
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
        reservations:
          memory: 32M

  # ---------------------------------------------------------------------------
  # NGINX — Reverse Proxy + Security Headers
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25.4-alpine
    container_name: loyallia-nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE  # Required for port 80/443
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Metrics Collection       → localhost:33909          [512M]
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: loyallia-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:33909:9090"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # GRAFANA — Metrics Dashboard           → localhost:33910          [512M]
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: loyallia-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "127.0.0.1:33910:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # LOKI — Log Aggregation              → localhost:33912            [256M]
  # LYL-H-INFRA-012: Centralized log collection and querying
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: loyallia-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:33912:3100"
    networks:
      - monitoring-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =============================================================================
# VOLUMES — All persistent, driver: local
# =============================================================================
volumes:
  postgres_data:
    driver: local
  postgres_replica_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
  next_cache:
    driver: local
  vault_data:
    driver: local
  vault_runtime:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

# =============================================================================
# NETWORKS — LYL-M-INFRA-017: Container network segmentation
# frontend-net: Nginx ↔ Web (public-facing)
# backend-net:  API ↔ Database ↔ Cache ↔ Workers (internal)
# monitoring-net: Prometheus ↔ Grafana ↔ Loki (observability)
# =============================================================================
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge
