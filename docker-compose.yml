# Loyallia Docker Compose Stack
# PORT RANGE: 33900+ (see docs/PORT_AUTHORITY.md)
# CLUSTER LIMIT: 12GB RAM total, ~9.4GB allocated (headroom for OS/Docker)
#
# SECRETS: Local development seeds Vault from .env. Production reads from Vault.
# Ref: LYL-SEC-001

x-common-env: &common-env
  DATABASE_URL: postgres://loyallia@postgres:5432/loyallia_dev
  DATABASE_DIRECT_URL: postgres://loyallia@postgres:5432/loyallia_dev
  # PgBouncer available at pgbouncer:6432 for connection pooling in production
  PGBOUNCER_URL: postgres://loyallia@pgbouncer:6432/loyallia_dev
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: https://rewards.loyallia.com
  PUBLIC_BASE_URL: https://rewards.loyallia.com
  MINIO_BUCKET_PASSES: passes
  MINIO_BUCKET_ASSETS: assets
  DJANGO_SETTINGS_MODULE: loyallia.settings.development
  DEBUG: "True"
  ALLOWED_HOSTS: "*"
  # CORS_ALLOWED_ORIGINS intentionally omitted — development.py sets CORS_ALLOW_ALL_ORIGINS=True
  # Vault: HTTPS with TLS certificates
  # Certificates mounted at /vault/certs/ in Vault container
  # API reads certs via VAULT_CACERT for TLS verification
  VAULT_ADDR: https://vault:8200
  VAULT_CACERT: /run/loyallia-vault/ca.crt
  VAULT_TOKEN_FILE: /run/loyallia-vault/app-token
  VAULT_SECRET_PATH: secret/data/loyallia/development
  # Apple Wallet
  APPLE_WALLET_MODE: vault
  # Google Wallet
  GOOGLE_WALLET_MODE: vault
  # Payment Gateway (manual admin verification or disabled)
  PAYMENT_GATEWAY_PROVIDER: manual
  PAYMENT_GATEWAY_BASE_URL:  
  # Email
  EMAIL_HOST: in-v3.mailjet.com
  EMAIL_PORT: "587"
  EMAIL_FROM: noreply@loyallia.com
  # Google OAuth 2.0 - local development mode
  # Local dev uses a separate Google OAuth client from production.
  # Create your own dev client at: https://console.cloud.google.com/apis/credentials
  #   Authorized JS origins: http://localhost:3000
  #   Authorized redirect URIs: http://localhost:33905/api/v1/auth/google/callback/
  # Then set in your local .env or Vault: GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
  GOOGLE_OAUTH_REDIRECT_URI: https://rewards.loyallia.com/api/v1/auth/google/callback/
  # Sentry error tracking (B-013)
  SENTRY_DSN:  
  # WhatsApp Bridge (LYL-SRS-006)
  WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3001
services:
  # PostgreSQL 16 primary database (localhost:33900, 1.5GB)
  # WAL archiving, tuned memory, persistent volume
  postgres:
    image: postgres:16.2-alpine
    container_name: loyallia-postgres
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: loyallia_dev
      POSTGRES_USER: loyallia
      POSTGRES_PASSWORD_FILE: /run/loyallia-vault/postgres_password
      # Production-grade PostgreSQL tuning
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=384MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=mkdir -p /var/lib/postgresql/data/wal_archive && (test -f /var/lib/postgresql/data/wal_archive/%f || cp %p /var/lib/postgresql/data/wal_archive/%f)"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33900:5432"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyallia -d loyallia_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL replica - streaming replication (LYL-H-INFRA-015)
  # Hot standby for read scaling and failover
  postgres-replica:
    image: postgres:16.2-alpine
    container_name: loyallia-postgres-replica
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: loyallia
      POSTGRES_PASSWORD_FILE: /run/loyallia-vault/postgres_password
      PGUSER: loyallia
      PGPASSWORD_FILE: /run/loyallia-vault/postgres_password
    command: sh /usr/local/bin/replica-entrypoint.sh
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33911:5432"
    networks:
      - backend-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyallia -d loyallia_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer connection pooling (localhost:33901, 128M)
  # Transaction pooling for high concurrency
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: loyallia-pgbouncer
    command: >
      sh -c "export DATABASE_URL=postgres://loyallia:$$(cat /run/loyallia-vault/postgres_password)@postgres:5432/loyallia_dev && exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini"
    environment:
      LISTEN_PORT: "6432"
      AUTH_TYPE: "scram-sha-256"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "80"
      MIN_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "20"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_IDLE_TIMEOUT: "300"
      SERVER_LIFETIME: "1800"
      LOG_CONNECTIONS: "1"
      LOG_DISCONNECTIONS: "1"
    ports:
      - "127.0.0.1:33901:6432"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - vault_runtime:/run/loyallia-vault:ro
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-019: PgBouncer healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U loyallia"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M

  # Redis 7 cache and Celery broker (localhost:33902, 512M)
  # AOF persistence, LRU eviction, production limits
  redis:
    image: redis:7.2.4-alpine
    container_name: loyallia-redis
    depends_on:
      vault-init:
        condition: service_completed_successfully
    command: >
      sh -c 'redis-server --dir /data --requirepass "$$(cat /run/loyallia-vault/redis_password)" --appendonly yes --appendfsync everysec --maxmemory 400mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000 --tcp-keepalive 300 --timeout 300'
    volumes:
      - redis_data:/data
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33902:6379"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/loyallia-vault/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-compatible object storage (localhost:33903-33904, 512M)
  # Stores passes and assets for Apple/Google Wallet
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: loyallia-minio
    depends_on:
      vault-init:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/loyallia-vault/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/loyallia-vault/minio_root_password
    volumes:
      - minio_data:/data
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "127.0.0.1:33903:9000"
      - "127.0.0.1:33904:9001"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: loyallia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      export MINIO_ROOT_USER=$$(cat /run/loyallia-vault/minio_root_user) &&
      export MINIO_ROOT_PASSWORD=$$(cat /run/loyallia-vault/minio_root_password) &&
      mc alias set local http://minio:9000 \$$MINIO_ROOT_USER \$$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/passes &&
      mc mb --ignore-existing local/assets &&
      mc anonymous set download local/assets &&
      echo 'MinIO buckets ready'
      "
    volumes:
      - vault_runtime:/run/loyallia-vault:ro
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"
        reservations:
          memory: 64M

  # Django API (localhost:33905, 2GB)
  # Runs migrations, collectstatic, then development server
  # Use gunicorn for production
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-api
    command: >
      sh -c "python manage.py migrate --database=direct --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *common-env
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
      - ./frontend/.auth:/frontend/.auth
    ports:
      - "127.0.0.1:33905:8000"
    stop_grace_period: 30s  # B-012: Graceful shutdown for in-flight requests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening (read_only omitted — dev volume mounts need write)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
        reservations:
          memory: 768M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.2
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Next.js frontend (localhost:33906, 2GB)
  # Optimized build with persistent .next cache
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: loyallia-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:33905
      NEXT_PUBLIC_APP_URL: http://localhost:33906
      NEXT_INTERNAL_API_URL: http://api:8000
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:33906:3000"
    stop_grace_period: 30s  # B-012: Graceful shutdown
    volumes:
      - ./frontend/package.json:/app/package.json
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/components.json:/app/components.json:ro
      - ./frontend/tests:/app/tests:ro
      - ./frontend/playwright.config.ts:/app/playwright.config.ts:ro
      - next_cache:/app/.next/cache
    command: ["sh", "-c", "npm install --legacy-peer-deps && npm run dev"]
    depends_on:
      - api
    networks:
      - frontend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "1.5"
        reservations:
          memory: 512M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

  # Celery workers - async task processing (1.2GB total)
  # max-tasks-per-child prevents memory leaks in long-running workers

  # Celery pass generation worker (384M)
  celery-pass:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-pass
    command: celery -A loyallia worker -Q pass_generation -c 2 -l info --max-tasks-per-child=500
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    stop_grace_period: 30s  # B-012: Graceful shutdown for in-flight tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-020: Celery worker healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A loyallia inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # Celery push notification worker (384M)
  celery-push:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-push
    command: celery -A loyallia worker -Q push_delivery -c 2 -l info --max-tasks-per-child=500
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    stop_grace_period: 30s  # B-012: Graceful shutdown
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-020: Celery worker healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A loyallia inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # Celery default queue worker - email, billing, automation (384M)
  celery-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-default
    command: celery -A loyallia worker -Q default,email,billing,whatsapp_delivery,sms_delivery -c 2 -l info --max-tasks-per-child=500
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    stop_grace_period: 30s  # B-012: Graceful shutdown
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # LYL-M-INFRA-020: Celery worker healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A loyallia inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # Celery Beat scheduled job scheduler (128M)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-celery-beat
    command: celery -A loyallia beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # FIX: `ps` is not available in the slim image; use /proc directly
      test: ["CMD-SHELL", "grep -q 'celery beat' /proc/*/cmdline 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
        reservations:
          memory: 96M

  # Flower Celery monitor (localhost:33907, 128M)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyallia-flower
    command: >
      sh -c "FLOWER_BASIC_AUTH=$$(python -c 'from common.vault import get_secret; print(get_secret(\"flower_basic_auth\", strict=True), end=\"\")') || exit 1; [ -n \"$$FLOWER_BASIC_AUTH\" ] || exit 1; export FLOWER_BASIC_AUTH; exec celery -A loyallia flower --port=5555"
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
      - vault_runtime:/run/loyallia-vault:ro
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:33907:5555"
    depends_on:
      - redis
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.error, urllib.request; url='http://localhost:5555';\ntry:\n    urllib.request.urlopen(url, timeout=3)\nexcept urllib.error.HTTPError as e:\n    sys.exit(0 if e.code == 401 else 1)\nexcept Exception:\n    sys.exit(1)\n\""]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"

  # WhatsApp Bridge - Baileys REST API (localhost:33914, 256M)
  # LYL-SRS-006: Multi-tenant WhatsApp messaging
  # Internal network only, never exposed to public internet
  whatsapp-bridge:
    build:
      context: ./services/whatsapp-bridge
      dockerfile: Dockerfile
    container_name: loyallia-whatsapp-bridge
    user: root
    environment:
      DJANGO_WEBHOOK_URL: http://api:8000
      REDIS_PASSWORD_FILE: /run/loyallia-vault/redis_password
      API_KEY_FILE: /run/loyallia-vault/whatsapp_bridge_api_key
      MAX_MESSAGES_PER_MINUTE: 8
      MAX_MESSAGES_PER_HOUR: 200
      AVG_DELAY_MS: 6000
      LOG_LEVEL: info
      NODE_ENV: development
    volumes:
      - vault_runtime:/run/loyallia-vault:ro
      - ./services/whatsapp-bridge/src:/app/src
    ports:
      - "127.0.0.1:33914:3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # HashiCorp Vault secret management (localhost:33908, 256M)
  vault:
    image: hashicorp/vault:1.15.6
    container_name: loyallia-vault
    command: vault server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    environment:
      # LYL-SEC-001: Vault uses HTTPS with Let's Encrypt certificates
      # Certificates mounted from host at /etc/letsencrypt/live/rewards.loyallia.com/
      VAULT_ADDR: https://0.0.0.0:8200
    volumes:
      - ./deploy/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
      # Mount real Let's Encrypt certificates (production)
      # Falls back to ./certs for local development
      - ${SSL_CERT_PATH:-/etc/letsencrypt/live/rewards.loyallia.com/fullchain.pem}:/vault/certs/vault.crt:ro
      - ${SSL_KEY_PATH:-/etc/letsencrypt/live/rewards.loyallia.com/privkey.pem}:/vault/certs/vault.key:ro
    ports:
      - "127.0.0.1:33908:8200"
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      # Use HTTPS with --no-check-certificate during bootstrap (self-signed OK)
      # After real certs are mounted, full verification works
      test: ["CMD", "wget", "--spider", "--quiet", "--no-check-certificate", "https://127.0.0.1:8200/v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200"]
      interval: 10s
      timeout: 5s
      retries: 10
      # B-021: Increased from 10s to 60s — Vault needs time to initialize
      # TLS, unseal, and become healthy. Prevents compose giving up too early.
      start_period: 60s

  # Vault KV v2 initialization — seeds secrets for development
  vault-init:
    image: hashicorp/vault:1.15.6
    container_name: loyallia-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      # LYL-SEC-001: Vault uses HTTPS with TLS certificates
      VAULT_ADDR: https://vault:8200
      VAULT_SKIP_VERIFY: "true"
      VAULT_APP_SECRET_PATH: loyallia/development
      BOOTSTRAP_SECRETS_FILE: /vault/bootstrap/secrets.env
      # Zero-Secret: Secrets injected via read-only flat .env volume mount.
      # Alpine vault container has NO Python — flat key=value format required.
    volumes:
      - vault_data:/vault/file
      - vault_runtime:/vault/runtime
      - ${SSL_CERT_PATH:-/etc/letsencrypt/live/rewards.loyallia.com/fullchain.pem}:/vault/certs/vault.crt:ro
      - ${SSL_KEY_PATH:-/etc/letsencrypt/live/rewards.loyallia.com/privkey.pem}:/vault/certs/vault.key:ro
      - ./deploy/vault/init.sh:/vault/bootstrap-script/init.sh:ro
      - ./.bootstrap_secrets.env:/vault/bootstrap/secrets.env:ro
    entrypoint: /bin/sh /vault/bootstrap-script/init.sh
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M

  # Nginx reverse proxy and security headers
  nginx:
    image: nginx:1.25.4-alpine
    container_name: loyallia-nginx
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE  # Required for port 80/443
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
      # LYL-H-INFRA-014: Rolling deployment
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first

  # Prometheus metrics collection (localhost:33909, 512M)
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: loyallia-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:33909:9090"
    networks:
      - backend-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  # Grafana metrics dashboard (localhost:33910, 512M)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: loyallia-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/loyallia-vault/grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - vault_runtime:/run/loyallia-vault:ro
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "127.0.0.1:33910:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net
    restart: unless-stopped
    # LYL-M-INFRA-018: Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  # Loki log aggregation (localhost:33912, 256M)
  # LYL-H-INFRA-012: Centralized log collection and querying
  loki:
    image: grafana/loki:2.9.4
    container_name: loyallia-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:33912:3100"
    networks:
      - monitoring-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Alertmanager alert routing (localhost:9093, 128M)
  # LYL-H-INFRA-013: Alert routing with SMTP email delivery
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: loyallia-alertmanager
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:9093:9093"
    networks:
      - backend-net
      - monitoring-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis Sentinel high availability (localhost:26379, 128M)
  # LYL-H-INFRA-015: Automatic failover when Redis master goes down
  redis-sentinel:
    image: redis:7.2.4-alpine
    container_name: loyallia-redis-sentinel
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c 'export REDIS_PASSWORD=$$(cat /run/loyallia-vault/redis_password) &&
      sed "s|\$${REDIS_PASSWORD}|$$REDIS_PASSWORD|g" /etc/redis/sentinel.conf > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf --sentinel'
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - sentinel-data:/data
      - vault_runtime:/run/loyallia-vault:ro
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:26379:26379"
    networks:
      - backend-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Volumes - all persistent, driver: local
volumes:
  postgres_data:
    driver: local
  postgres_replica_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
  next_cache:
    driver: local
  node_modules:
    driver: local
  vault_data:
    driver: local
  vault_runtime:
    driver: local
  loyallia_bootstrap_tmp:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  alertmanager-data:
    driver: local
  sentinel-data:
    driver: local

# Networks - LYL-M-INFRA-017: Container network segmentation
# frontend-net: Nginx to Web (public-facing)
# backend-net: API to Database, Cache, Workers (internal)
# monitoring-net: Prometheus, Grafana, Loki (observability)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge
