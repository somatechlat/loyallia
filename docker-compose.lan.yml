# =============================================================================
# Loyallia — LAN Override for Mobile Development Testing
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d
#
# This override changes port bindings from 127.0.0.1 (localhost-only)
# to 0.0.0.0 (all interfaces) so mobile devices on the same WiFi
# can access the development server for full-flow testing.
#
# SECURITY: Only use this on trusted private networks. Never commit
# secrets or use this in production.
# =============================================================================

services:
  web:
    ports:
      - "0.0.0.0:33906:3000"
    environment:
      # Ensure Next.js knows the external origin for OAuth redirects
      NEXT_PUBLIC_APP_URL: ${LAN_APP_URL:-http://192.168.1.230:33906}

  api:
    ports:
      - "0.0.0.0:33905:8000"
    environment:
      # Django needs to know external origin for redirects/emails
      APP_URL: ${LAN_APP_URL:-http://192.168.1.230:33906}
      # Ensure ALLOWED_HOSTS includes LAN IP (development.py uses ["*"] already)
      ALLOWED_HOSTS: ${LAN_IP:-192.168.1.230},localhost,127.0.0.1

  nginx:
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
